name: CI

on:
  push:
    branches: [develop, staging, main]
  pull_request:
    branches: [develop]

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Run static analysis
        run: poetry run ruff check app/ tests/

      - name: Run tests
        run: poetry run pytest tests/ --cov=app --cov-report=term-missing

  prometheus-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install promtool
        run: |
          wget -q https://github.com/prometheus/prometheus/releases/download/v2.52.0/prometheus-2.52.0.linux-amd64.tar.gz
          tar -xzf prometheus-2.52.0.linux-amd64.tar.gz
          sudo mv prometheus-2.52.0.linux-amd64/promtool /usr/local/bin/

      - name: Test alert rules
        run: promtool test rules monitoring/prometheus/tests/alerts_test.yml

  dbt-tests:
    runs-on: ubuntu-latest
    services:
      warehouse:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oilgas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: oilgas
      DBT_PROFILES_DIR: ${{ github.workspace }}/ci/dbt
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Pin a 1.8.*: sin el pin, pip arrastra dbt-core 2.0 alpha (motor Fusion,
      # que no soporta Postgres) y rompe el build.
      - name: Install dbt
        run: pip install "dbt-core==1.8.*" "dbt-postgres==1.8.*"

      - name: Install postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Cargar fixtures en Bronze
        run: psql "postgresql://postgres:postgres@localhost:5432/oilgas" -v ON_ERROR_STOP=1 -f ci/fixtures/bronze_seed.sql

      - name: dbt build (construye Silver/Gold + corre los tests de calidad)
        run: dbt build --project-dir data_platform/dbt/oilgas --target ci

  build-and-scan:
    needs: [test, prometheus-rules, dbt-tests]
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Buildear imagen Docker
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ github.ref_name }} .

      - name: Escanear imagen con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.ref_name }}
          format: table
          output: Reports/report.txt
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 0

      - name: Commitear reporte
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add Reports/report.txt
          git commit -m "chore: actualizar reporte de vulnerabilidades" || true
          git push

      - name: Verificar vulnerabilidades criticas
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.ref_name }}
          format: table
          exit-code: 1
          severity: CRITICAL
          ignore-unfixed: true

  push:
    needs: build-and-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y Push a ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ github.ref_name }} .
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ github.ref_name }}