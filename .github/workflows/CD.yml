              \"sudo systemctl enable docker\",
              \"sudo systemctl start docker\",
              \"aws ecr get-login-password --region ${{ env.AWS_REGION }} | sudo docker login --username AWS --password-stdin $ECR_REGISTRY\",
              \"sudo docker pull $IMAGE_URI\",
              \"sudo docker stop api || true\",
              \"sudo docker rm api || true\",
              \"sudo docker run -d --name api --restart always -p 8000:8000 $IMAGE_URI\"
            ]}" \
            --timeout-seconds 120 \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"
          sleep 5

          INSTANCE_ID=$(aws ssm list-command-invocations \
            --command-id "$COMMAND_ID" \
            --region ${{ env.AWS_REGION }} \
            --query "CommandInvocations[0].InstanceId" \
            --output text)

