          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deploy en EC2 via SSM
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:staging"

          COMMAND_ID=$(aws ssm send-command \
            --region ${{ env.AWS_REGION }} \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Name,Values=tp-staging" \
            --parameters "{\"commands\":[
              \"sudo yum install docker -y || sudo amazon-linux-extras install docker -y\",
              \"sudo yum install git -y\",
              \"sudo systemctl enable docker\",
              \"sudo systemctl start docker\",
              \"sudo curl -L https://github.com/docker/compose/releases/latest/download/docker-compose-Linux-x86_64 -o /usr/local/bin/docker-compose\",
              \"sudo chmod +x /usr/local/bin/docker-compose\",
              \"aws ecr get-login-password --region ${{ env.AWS_REGION }} | sudo docker login --username AWS --password-stdin $ECR_REGISTRY\",
              \"sudo rm -rf /app && sudo git clone https://$GH_TOKEN@github.com/fedegutman/tp-software.git /app && sudo git -C /app checkout staging\",
              \"echo 'API_IMAGE=$IMAGE_URI' | sudo tee /app/.env\",
              \"echo 'SLACK_WEBHOOK_URL=$SLACK_WEBHOOK_URL' | sudo tee -a /app/.env\",
              \"sudo docker ps -q | xargs -r sudo docker stop; sudo docker ps -aq | xargs -r sudo docker rm\",
              \"cd /app && sudo docker-compose pull\",
              \"cd /app && sudo docker-compose up -d\"
            ]}" \
            --timeout-seconds 180 \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"
          sleep 5

          INSTANCE_ID=$(aws ssm list-command-invocations \
            --command-id "$COMMAND_ID" \
            --region ${{ env.AWS_REGION }} \
            --query "CommandInvocations[0].InstanceId" \
            --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region ${{ env.AWS_REGION }}

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region ${{ env.AWS_REGION }} \
            --query "Status" \
            --output text)

          echo "Deployment status: $STATUS"

          if [ "$STATUS" != "Success" ]; then
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region ${{ env.AWS_REGION }} \
              --query "StandardErrorContent" \
              --output text
            exit 1
          fi

  deploy-prod:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deploy en EC2 via SSM
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:main"

          COMMAND_ID=$(aws ssm send-command \
            --region ${{ env.AWS_REGION }} \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Name,Values=tp-prod" \
            --parameters "{\"commands\":[
              \"sudo yum install docker -y || sudo amazon-linux-extras install docker -y\",
              \"sudo yum install git -y\",
              \"sudo systemctl enable docker\",
              \"sudo systemctl start docker\",
              \"sudo curl -L https://github.com/docker/compose/releases/latest/download/docker-compose-Linux-x86_64 -o /usr/local/bin/docker-compose\",
              \"sudo chmod +x /usr/local/bin/docker-compose\",
              \"aws ecr get-login-password --region ${{ env.AWS_REGION }} | sudo docker login --username AWS --password-stdin $ECR_REGISTRY\",
              \"sudo rm -rf /app && sudo git clone https://$GH_TOKEN@github.com/fedegutman/tp-software.git /app && sudo git -C /app checkout main\",
              \"echo 'API_IMAGE=$IMAGE_URI' | sudo tee /app/.env\",
              \"echo 'SLACK_WEBHOOK_URL=$SLACK_WEBHOOK_URL' | sudo tee -a /app/.env\",
              \"sudo docker ps -q | xargs -r sudo docker stop; sudo docker ps -aq | xargs -r sudo docker rm\",
              \"cd /app && sudo docker-compose pull\",
              \"cd /app && sudo docker-compose up -d\"
            ]}" \
            --timeout-seconds 180 \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"
          sleep 5

          INSTANCE_ID=$(aws ssm list-command-invocations \
            --command-id "$COMMAND_ID" \
            --region ${{ env.AWS_REGION }} \
            --query "CommandInvocations[0].InstanceId" \
            --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region ${{ env.AWS_REGION }}

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region ${{ env.AWS_REGION }} \
            --query "Status" \
            --output text)

          echo "Deployment status: $STATUS"

          if [ "$STATUS" != "Success" ]; then
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region ${{ env.AWS_REGION }} \
