[project]
name = "tp-software"
version = "0.1.0"
description = ""
authors = [
    {name = "Federico Gutman",email = "fgutman@udesa.edu.ar"}
]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "fastapi (>=0.135.3,<0.136.0)",
    "uvicorn (>=0.44.0,<0.45.0)",
    "prometheus-client (>=0.25.0,<0.26.0)",
    "slowapi (>=0.1.9,<0.2.0)",
    "psycopg[binary,pool] (>=3.3.0,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "ruff (>=0.15.10,<0.16.0)"
]
