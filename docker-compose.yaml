services:
  api:
    image: ${API_IMAGE}
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      # API key: se pasa desde el entorno/secret (sin default). Si falta, la API rechaza todo.
      - API_KEY=${API_KEY}
      # Conexión al warehouse (gold). En contenedor, el warehouse del host se alcanza
      # via host.docker.internal (Docker Desktop). En prod se sobreescribe con el secret.
      - WAREHOUSE_DSN=${WAREHOUSE_DSN:-postgresql://dwh:dwh@host.docker.internal:5433/oilgas}
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.52.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
      - --storage.tsdb.retention.time=15d
    depends_on:
      - api
      - alertmanager
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.0.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.7.0
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    restart: unless-stopped

  # Warehouse (capa gold) para servir la API en prod. Magro a propósito: la t2.micro
  # tiene 1 GB, así que shared_buffers/work_mem chicos + mem_limit para no ahogar al resto.
  # SIN "ports": no se expone público; solo lo alcanza la API por la red interna (host "warehouse").
  # La carga del gold se hace por "docker exec" desde la instancia (no por red expuesta).
  warehouse:
    image: postgres:16
    environment:
      - POSTGRES_USER=dwh
      - POSTGRES_PASSWORD=${WAREHOUSE_PASSWORD:-dwh}
      - POSTGRES_DB=oilgas
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=20
    volumes:
      - warehouse-data:/var/lib/postgresql/data
    mem_limit: 320m
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
  warehouse-data: