# Plataforma de datos — Fase 2
# Basado en el docker-compose oficial de Apache Airflow 3.1.7 (CeleryExecutor) visto en clase.
# Agregados respecto del original:
#   - servicio `warehouse` (Postgres) -> aquí viven Bronze / Silver / Gold
#   - volumen `./dbt` montado en Airflow + env DBT_PROFILES_DIR -> para correr dbt desde los DAGs
# Metabase (BI) y DataHub (gobierno) se suman en sus propias etapas.
#
# Levantar:  docker compose up airflow-init   (una sola vez)
#            docker compose up -d
# UI Airflow: http://localhost:8080  (airflow / airflow)
---
x-airflow-common:
  &airflow-common
  image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:3.1.7}
  # build: .
  env_file:
    - ${ENV_FILE_PATH:-.env}
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'        # sin DAGs de ejemplo (los nuestros son los que importan)
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-}
    AIRFLOW_CONFIG: '/opt/airflow/config/airflow.cfg'
    # --- agregado para dbt: dónde está el profiles.yml del proyecto ---
    DBT_PROFILES_DIR: '/opt/airflow/dbt/oilgas'
  volumes:
    - ${AIRFLOW_PROJ_DIR:-.}/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR:-.}/logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR:-.}/config:/opt/airflow/config
    - ${AIRFLOW_PROJ_DIR:-.}/plugins:/opt/airflow/plugins
    - ${AIRFLOW_PROJ_DIR:-.}/dbt:/opt/airflow/dbt      # --- agregado: el proyecto dbt ---
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:
  # Base de metadatos INTERNA de Airflow (no es el warehouse).
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  # --- AGREGADO: EL WAREHOUSE. Acá viven Bronze / Silver / Gold. ---
  warehouse:
    image: postgres:16
    environment:
      POSTGRES_USER: dwh
      POSTGRES_PASSWORD: dwh
      POSTGRES_DB: oilgas
    ports:
      - "5433:5432"        # expuesto en 5433 para conectarte desde tu máquina / Metabase / DataHub
    volumes:
      - warehouse-db-volume:/var/lib/postgresql/data
      - ${AIRFLOW_PROJ_DIR:-.}/warehouse/init:/docker-entrypoint-initdb.d:ro   # crea los schemas medallion
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "dwh"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  redis:
    # Redis is limited to 7.2-bookworm due to licencing change
    # https://redis.io/blog/redis-adopts-dual-source-available-licensing/
    image: redis:7.2-bookworm
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s
    restart: always

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-worker:
    <<: *airflow-common
    command: celery worker
    healthcheck:
      test:
        - "CMD-SHELL"
        - 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}" || celery --app airflow.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      <<: *airflow-common-env
      DUMB_INIT_SETSID: "0"
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-apiserver:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        if [[ -z "${AIRFLOW_UID}" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: AIRFLOW_UID not set!\e[0m"
          echo "If you are on Linux, you SHOULD follow the instructions below to set "
          echo "AIRFLOW_UID environment variable, otherwise files will be owned by root."
          echo "For other operating systems you can get rid of the warning with manually created .env file:"
          echo "    See: https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#setting-the-right-airflow-user"
          echo
          export AIRFLOW_UID=$$(id -u)
        fi
        one_meg=1048576
        mem_available=$$(($$(getconf _PHYS_PAGES) * $$(getconf PAGE_SIZE) / one_meg))
        cpus_available=$$(grep -cE 'cpu[0-9]+' /proc/stat)
        disk_available=$$(df / | tail -1 | awk '{print $$4}')
        warning_resources="false"
        if (( mem_available < 4000 )) ; then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough memory available for Docker.\e[0m"
          echo "At least 4GB of memory required. You have $$(numfmt --to iec $$((mem_available * one_meg)))"
          echo
          warning_resources="true"
        fi
        if (( cpus_available < 2 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough CPUS available for Docker.\e[0m"
          echo "At least 2 CPUs recommended. You have $${cpus_available}"
          echo
          warning_resources="true"
        fi
        if (( disk_available < one_meg * 10 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough Disk space available for Docker.\e[0m"
          echo "At least 10 GBs recommended. You have $$(numfmt --to iec $$((disk_available * 1024 )))"
          echo
          warning_resources="true"
        fi
        if [[ $${warning_resources} == "true" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: You have not enough resources to run Airflow (see above)!\e[0m"
          echo "Please follow the instructions to increase amount of resources available:"
          echo "   https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#before-you-begin"
          echo
        fi
        echo
        echo "Creating missing opt dirs if missing:"
        echo
        mkdir -v -p /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Airflow version:"
        /entrypoint airflow version
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Running airflow config list to create default config file if missing."
        echo
        /entrypoint airflow config list >/dev/null
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Change ownership of files in /opt/airflow to ${AIRFLOW_UID}:0"
        echo
        chown -R "${AIRFLOW_UID}:0" /opt/airflow/
        echo
        echo "Change ownership of files in shared volumes to ${AIRFLOW_UID}:0"
        echo
        chown -v -R "${AIRFLOW_UID}:0" /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins,config}

    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
      _PIP_ADDITIONAL_REQUIREMENTS: ''
    user: "0:0"

  airflow-cli:
    <<: *airflow-common
    profiles:
      - debug
    environment:
      <<: *airflow-common-env
      CONNECTION_CHECK_MAX_COUNT: "0"
    command:
      - bash
      - -c
      - airflow
    depends_on:
      <<: *airflow-common-depends-on

  flower:
    <<: *airflow-common
    command: celery flower
    profiles:
      - flower
    ports:
      - "5555:5555"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:5555/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
  
  metabase:
    image: metabase/metabase:latest
    ports:
      - "3001:3000"
    environment:
      # H2 embebida persistida en el volumen, asi la config (usuario, base, dashboards)
      # sobrevive a un `docker compose down` sin -v.
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase-data:/metabase-data
    depends_on:
      - warehouse
    restart: unless-stopped
  
  metabase-init:
    image: python:3.12-slim
    volumes:
      - ./metabase:/app
    working_dir: /app
    command: >
      sh -c "pip install requests -q && python setup_metabase.py"
    environment:
      MB_HOST: http://metabase:3000
      MB_ADMIN_EMAIL: admin@oilgas.com
      MB_ADMIN_PASSWORD: Admin1234!
      PG_HOST: warehouse
      PG_PORT: 5432
      PG_DB: oilgas
      PG_USER: dwh
      PG_PASSWORD: dwh
    depends_on:
      - metabase
    restart: on-failure

  dbt-docs:
    image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:3.1.7}
    # Carga el .env para que el entrypoint de la imagen instale dbt
    # (_PIP_ADDITIONAL_REQUIREMENTS); si no, el contenedor no tiene el binario `dbt`.
    env_file:
      - ${ENV_FILE_PATH:-.env}
    environment:
      _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-}
      DBT_PROFILES_DIR: '/opt/airflow/dbt/oilgas'
    command: >
      bash -c "
        dbt docs generate --project-dir /opt/airflow/dbt/oilgas --profiles-dir /opt/airflow/dbt/oilgas &&
        dbt docs serve --project-dir /opt/airflow/dbt/oilgas --profiles-dir /opt/airflow/dbt/oilgas --port 8082 --host 0.0.0.0 --no-browser
      "
    ports:
      - "8082:8082"
    volumes:
      - ${AIRFLOW_PROJ_DIR:-.}/dbt:/opt/airflow/dbt
    depends_on:
      - warehouse
    restart: unless-stopped

  # --- AGREGADO (Fase 3): MLflow = Experiment Tracking + Model Registry. ---
  # Backend (metadatos de runs/modelos) = base `mlflow` en el Postgres del warehouse (separada de oilgas).
  # Artifact store = volumen Docker LOCAL (no S3 → corre en cualquier máquina sin credenciales AWS). Ver ADR-024.
  mlflow:
    build: ./mlflow
    ports:
      - "5500:5000"        # UI/API de MLflow → http://localhost:5500 (host 5500 evita el conflicto de AirPlay con 5000 en macOS)
    environment:
      MLFLOW_DB_HOST: warehouse
      MLFLOW_DB_PORT: "5432"
      MLFLOW_DB_USER: dwh
      MLFLOW_DB_PASSWORD: dwh
      MLFLOW_DB_NAME: mlflow
      MLFLOW_ARTIFACTS: /mlflow/artifacts
    volumes:
      - mlflow-artifacts:/mlflow/artifacts
    depends_on:
      warehouse:
        condition: service_healthy
    restart: unless-stopped

  # --- AGREGADO (Fase 3): tracer bullet ML (circuito e2e con modelo trivial). ---
  # No arranca con `up -d` (profile "ml"); se corre a demanda:
  #   docker compose --profile ml run --rm ml-tracer
  # Lee el feature store, entrena, registra en MLflow y escribe gold.fct_forecast. Ver WS4.
  ml-tracer:
    build: ./ml
    profiles: ["ml"]
    environment:
      WAREHOUSE_DSN: postgresql://dwh:dwh@warehouse:5432/oilgas
      MLFLOW_TRACKING_URI: http://mlflow:5000
      TARGET: prod_pet        # 'prod_pet' o 'prod_gas' (multi-target)
    depends_on:
      - warehouse
      - mlflow
    restart: "no"

volumes:
  postgres-db-volume:
  warehouse-db-volume:       # --- agregado: datos del warehouse ---
  metabase-data:             # --- agregado: config/dashboards de Metabase ---
  mlflow-artifacts:          # --- agregado: artifact store local de MLflow (Fase 3) ---
