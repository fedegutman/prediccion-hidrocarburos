name: "oilgas"
version: "1.0.0"
config-version: 2

profile: "oilgas"

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Cada subcarpeta de models/ se materializa en su schema medallion.
# silver -> vistas/tablas limpias ; gold -> modelo estrella.
# persist_docs: vuelca las descriptions de modelos/columnas como COMMENT en Postgres
# (mejora discoverability / gobierno de datos).
models:
  oilgas:
    +persist_docs:
      relation: true
      columns: true
    silver:
      +schema: silver
      +materialized: view
    gold:
      # +schema parametrizable por var para habilitar la promoción Write-Audit-Publish:
      # el DAG dbt_transform construye y testea gold en un schema staging (gold_staging) y
      # recién hace swap a `gold` si pasan los tests. Default 'gold' => `dbt build` local y el
      # CI se comportan igual que antes (no se pasa la var). Ver ADR-032.
      +schema: "{{ var('gold_schema', 'gold') }}"
      +materialized: table

# store_failures: las filas que fallan un test (incluidos los warn) se PERSISTEN en tablas
# del schema dq_failures, en vez de perderse en el log. Cada corrida sobreescribe la tabla.
# Es la base para "calidad de datos persistida con consecuencia" (auditoría de DQ).
tests:
  oilgas:
    +store_failures: true
    +schema: dq_failures
